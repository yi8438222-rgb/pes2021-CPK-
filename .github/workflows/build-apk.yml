name: Build PES CPK Tool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf PES_CPK_Tool_Android_build
          mkdir PES_CPK_Tool_Android_build
          unzip -q PES_CPK_Tool_Android_v3.2.zip -d PES_CPK_Tool_Android_build

      - name: Build debug APK
        working-directory: PES_CPK_Tool_Android_build/PES_CPK_Tool_Android
        run: |
          gradle --no-daemon -Pandroid.useAndroidX=true assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES-CPK-Tool-debug-APK-v3.2
          path: PES_CPK_Tool_Android_build/PES_CPK_Tool_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
